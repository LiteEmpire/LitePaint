<script>

$('fileInput').onchange=function(e){var f=e.target.files[0];if(!f)return;var url=URL.createObjectURL(f),im=new Image();im.onload=function(){canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;overlay.width=canvas.width;overlay.height=canvas.height;ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);bg='#ffffff';history=[];future=[];selection=null;clearOverlay();record();dims();applyZoom();$('docTitle').textContent=f.name+' — Lite Paint';URL.revokeObjectURL(url);e.target.value='';};im.onerror=function(){alert('Unable to open this image file.');URL.revokeObjectURL(url);};im.src=url;};
$('newBtn').onclick=function(){if(confirm('Start a new blank drawing?'))newCanvas(800,600);};$('newCanvasBtn').onclick=function(){newCanvas(800,600);};
$('clearBtn').onclick=function(){if(confirm('Clear the whole canvas?')){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);selection=null;clearOverlay();record();}};
$('backgroundBtn').onclick=function(){var c=prompt('Background colour in hex (for example #ffffff):',bg);if(c&&/^#[0-9a-f]{6}$/i.test(c)){var old=ctx.getImageData(0,0,canvas.width,canvas.height),temp=document.createElement('canvas');temp.width=canvas.width;temp.height=canvas.height;var tc=temp.getContext('2d');tc.fillStyle=c;tc.fillRect(0,0,temp.width,temp.height);tc.drawImage(canvas,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(temp,0,0);bg=c;record();}};
function resizeCanvas(){var w=Number(prompt('New canvas width (1–5000 px):',canvas.width)),h=Number(prompt('New canvas height (1–5000 px):',canvas.height));if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>5000||h>5000){alert('Enter whole-number dimensions from 1 to 5000.');return;}var scale=confirm('Press OK to scale existing artwork to fit the new size. Press Cancel to keep the old pixels at the top-left and crop/pad.');var temp=document.createElement('canvas');temp.width=canvas.width;temp.height=canvas.height;temp.getContext('2d').drawImage(canvas,0,0);canvas.width=w;canvas.height=h;overlay.width=w;overlay.height=h;ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.drawImage(temp,0,0,scale?w:temp.width,scale?h:temp.height);selection=null;clearOverlay();history=[];future=[];record();dims();applyZoom();}
$('resizeBtn').onclick=$('canvasSizeBtn').onclick=resizeCanvas;
function transform(kind){var old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);var w=old.width,h=old.height;if(kind==='left'||kind==='right'){canvas.width=h;canvas.height=w;overlay.width=h;overlay.height=w;ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.save();if(kind==='left'){ctx.translate(0,w);ctx.rotate(-Math.PI/2);}else{ctx.translate(h,0);ctx.rotate(Math.PI/2);}ctx.drawImage(old,0,0);ctx.restore();}else{ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(kind==='h'?w:0,kind==='v'?h:0);ctx.scale(kind==='h'?-1:1,kind==='v'?-1:1);ctx.drawImage(old,0,0);ctx.restore();}selection=null;clearOverlay();history=[];future=[];record();dims();applyZoom();}
$('rotateLeft').onclick=function(){transform('left');};$('rotateRight').onclick=function(){transform('right');};$('flipH').onclick=function(){transform('h');};$('flipV').onclick=function(){transform('v');};$('rotateBtn').onclick=function(){var a=prompt('Enter left, right, flip-h or flip-v:', 'right');if(a==='left')transform('left');else if(a==='right')transform('right');else if(a==='flip-h')transform('h');else if(a==='flip-v')transform('v');};
$('printBtn').onclick=function(){window.print();};$('swapColors').onclick=function(){var a=$('color').value;$('color').value=$('color2').value;$('color2').value=a;};$('resetColors').onclick=function(){$('color').value='#000000';$('color2').value='#ffffff';};
palette.forEach(function(c){var b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=c;b.setAttribute('aria-label','Choose '+c);b.onclick=function(){ $('color').value=c;};$('palette').appendChild(b);});
$('zoom').oninput=function(e){setZoom(+e.target.value/100);};$('zoomIn').onclick=function(){setZoom(zoom*1.25);};$('zoomOut').onclick=function(){setZoom(zoom/1.25);};$('zoomReset').onclick=function(){setZoom(1);};
$('gridToggle').onchange=function(e){grid=e.target.checked;paper.classList.toggle('grid',grid);};
$('rulerToggle').onchange=function(e){$('coords').classList.toggle('hidden',!e.target.checked);if(e.target.checked)$('statusText').textContent='Coordinate guide enabled';};
$('statusToggle').onchange=function(e){$('status').classList.toggle('hidden',!e.target.checked);};
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-tab]').forEach(function(t){t.classList.toggle('active',t===b);});$('homeRibbon').classList.toggle('hidden',b.dataset.tab!=='home');$('viewRibbon').classList.toggle('hidden',b.dataset.tab!=='view');};});
ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);record();dims();applyZoom();setTool('pencil');sync();
